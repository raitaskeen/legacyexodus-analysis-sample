name: CodeRabbit AI Review

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Base branch to compare against"
        required: false
        default: "main"
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  coderabbit-review:
    name: CodeRabbit Review
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'coderabbit-review')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check Eligibility and Filter Changes
        id: filter
        run: |
          # Check for secret availability (protect against untrusted fork PRs)
          if [ -z "${{ secrets.CODERABBIT_API_KEY }}" ]; then
            echo "::notice ::CODERABBIT_API_KEY secret is not available (fork PR or secret unconfigured). Skipping AI review."
            echo "### CodeRabbit AI Review" >> $GITHUB_STEP_SUMMARY
            echo "Skipped: \`CODERABBIT_API_KEY\` is not available in this execution context (external fork or unconfigured secret)." >> $GITHUB_STEP_SUMMARY
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # If triggered by pull_request labeled event
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Skip Dependabot PRs
            PR_USER="${{ github.event.pull_request.user.login }}"
            if [ "$PR_USER" = "dependabot[bot]" ]; then
              echo "::notice ::Skipping CodeRabbit review for Dependabot PR."
              echo "### CodeRabbit AI Review" >> $GITHUB_STEP_SUMMARY
              echo "Skipped: Automated review is disabled for Dependabot PRs." >> $GITHUB_STEP_SUMMARY
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            # Inspect changed files between base and head
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null || git diff --name-only "HEAD~1...HEAD" 2>/dev/null || true)
            echo "Changed files:"
            echo "$CHANGED_FILES"

            # Check if all changed files are docs, markdown, or licenses
            NON_DOC_FILES=$(echo "$CHANGED_FILES" | grep -v -E '^(README\.md|docs/|.*\.md|LICENSE|NOTICE)$' || true)
            if [ -z "$NON_DOC_FILES" ] && [ -n "$CHANGED_FILES" ]; then
              echo "::notice ::Skipping CodeRabbit review: changes are documentation-only."
              echo "### CodeRabbit AI Review" >> $GITHUB_STEP_SUMMARY
              echo "Skipped: All changed files are documentation or legal files (\`README.md\`, \`docs/**\`, \`*.md\`, \`LICENSE\`, \`NOTICE\`)." >> $GITHUB_STEP_SUMMARY
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Install CodeRabbit CLI
        if: steps.filter.outputs.skip != 'true'
        run: |
          curl -fsSL https://cli.coderabbit.ai/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          "$HOME/.local/bin/coderabbit" --version

      - name: Authenticate and Run CodeRabbit Review
        if: steps.filter.outputs.skip != 'true'
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
        run: |
          # Determine base branch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE_BRANCH="${{ inputs.base_branch }}"
          else
            BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          fi
          BASE_BRANCH="${BASE_BRANCH:-main}"

          # Ensure base branch reference is available locally
          git branch --track "$BASE_BRANCH" "origin/$BASE_BRANCH" 2>/dev/null || true

          echo "Authenticating CodeRabbit CLI..."
          set +e
          AUTH_OUTPUT=$(coderabbit auth login --api-key "$CODERABBIT_API_KEY" 2>&1)
          AUTH_EXIT=$?
          set -e

          echo "$AUTH_OUTPUT"

          if [ $AUTH_EXIT -ne 0 ]; then
            echo "::warning ::CodeRabbit authentication failed. Ensure an Agentic API key is configured."
            echo "## CodeRabbit AI Review Report" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ⚠️ Informational Notice (Service / Auth Failure)" >> $GITHUB_STEP_SUMMARY
            echo "**Target Ref:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Base Branch:** \`$BASE_BRANCH\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Authentication Error" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            echo "$AUTH_OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> [!IMPORTANT]" >> $GITHUB_STEP_SUMMARY
            echo "> The CodeRabbit CLI requires an **Agentic API key** generated from your CodeRabbit organization settings, rather than a personal user API key." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "Running CodeRabbit review comparing against base: $BASE_BRANCH"
          set +e
          coderabbit review --plain --no-color --base "$BASE_BRANCH" > coderabbit_review.txt 2>&1
          EXIT_CODE=$?
          set -e

          echo "CodeRabbit review finished with exit code: $EXIT_CODE"
          cat coderabbit_review.txt

          echo "## CodeRabbit AI Review Report" >> $GITHUB_STEP_SUMMARY
          echo "**Target Ref:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Base Branch:** \`$BASE_BRANCH\`" >> $GITHUB_STEP_SUMMARY
          echo "**Exit Code:** \`$EXIT_CODE\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $EXIT_CODE -eq 0 ]; then
            echo "### Review Output" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            head -c 60000 coderabbit_review.txt >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### Service Notice" >> $GITHUB_STEP_SUMMARY
            echo "CodeRabbit returned exit code \`$EXIT_CODE\` during review execution." >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            head -c 10000 coderabbit_review.txt >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
