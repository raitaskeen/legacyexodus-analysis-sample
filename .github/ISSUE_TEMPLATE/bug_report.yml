name: Bug Report
description: Report a bug in CLI execution, formatting, or project tooling.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please note that this is a public source-visible sample repository.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands or code to reproduce the issue.
      placeholder: |
        1. Run `bun run analyze ...`
        2. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: input
    id: bun_version
    attributes:
      label: Bun Version
      placeholder: e.g. 1.4.2
    validations:
      required: true